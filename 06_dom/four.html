<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 4</title>
</head>
<body style="background-color: black; color: #fff;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
    
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector(".language").appendChild(li)
    }
    addLanguage("python")
    addLanguage("react")

    function addOptiLanguage (langName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName))
        document.querySelector(".language").appendChild(li)

    }
    addOptiLanguage ('goLang')

    //Edit

    const secLang = document.querySelector("li:nth-child(2)")
    console.log(secLang)
    // secLang.innerHTML = "Mojo"
    const newLi = document.createElement ("li")
    // newLi.textContent = "Mojo"
    newLi.appendChild(document.createTextNode("Mojo"))
    document.querySelector(".language").appendChild(newLi)

    secLang.replaceWith(newLi)

    //edit
    const FirstLang = document.querySelector("li:first-child")
    FirstLang.outerHTML = "<li> TypeScript </li>"
    // const newli= document.createElement("li")
    // newli.appendChild(document.createTextNode("Ruby"))
    // document.querySelector(".language").appendChild(newli)
    
    // FirstLang.replaceWith(newli)
    

    // remove

    const LastLang = document.querySelector("li:last-child")
    LastLang.remove ()
</script>
</html>
